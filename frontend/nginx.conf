server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — el router del frontend usa hash routing,
    # pero por las dudas servimos index.html en cualquier ruta no encontrada.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea: es el único archivo que referencia a los
    # bundles versionados, así que si el navegador se queda con una copia vieja
    # sigue pidiendo chunks de una versión anterior y la aplicación queda
    # desactualizada aunque el servidor ya tenga la nueva.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # Cache para assets estáticos: llevan hash en el nombre, así que un cambio
    # genera un nombre nuevo y nunca se sirve contenido viejo.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
