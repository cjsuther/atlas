upstream atlas_backend  { server backend:9000; }
upstream atlas_frontend { server frontend:80;   }

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # ----- Compresión -----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ----- Security headers -----
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;

    # ------------------------------------------------------------------
    # API Backend (Laravel) — toda /api/* va a PHP-FPM vía FastCGI.
    # Laravel se encarga del routing internamente (front-controller pattern).
    # ------------------------------------------------------------------
    location ^~ /api {
        fastcgi_pass atlas_backend;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_param REQUEST_METHOD  $request_method;
        fastcgi_param CONTENT_TYPE    $content_type;
        fastcgi_param CONTENT_LENGTH  $content_length;
        fastcgi_param HTTPS           off;

        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ------------------------------------------------------------------
    # Frontend SPA — todo lo demás va al contenedor frontend (NGINX estático)
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://atlas_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
